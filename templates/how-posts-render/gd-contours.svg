<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 56 600 208" width="600" height="208" role="img" aria-labelledby="title desc">
  <title id="title">Gradient descent on an ill-conditioned quadratic</title>
  <desc id="desc">Elliptical contour lines around a minimum. The gradient descent path starts on the outer contour and zig-zags across the narrow direction while it moves slowly along the wide direction. A dashed straight line joins the start and the minimum.</desc>
  <!-- Contours of f(x, y) = (x^2 + 10 y^2) / 2, drawn at 55.6 px per unit around (320, 160). -->
  <g fill="none" stroke="#8a94a6" stroke-opacity="0.55" stroke-width="1.25">
    <ellipse cx="320" cy="160" rx="283.6" ry="89.7"/>
    <ellipse cx="320" cy="160" rx="222.4" ry="70.3"/>
    <ellipse cx="320" cy="160" rx="166.8" ry="52.7"/>
    <ellipse cx="320" cy="160" rx="111.2" ry="35.2"/>
    <ellipse cx="320" cy="160" rx="55.6" ry="17.6"/>
  </g>
  <line x1="97.6" y1="104.4" x2="320" y2="160" stroke="#8a94a6" stroke-width="1.25" stroke-dasharray="5 5"/>
  <!-- Iterates of gradient descent from (-4, 1) with step size 0.18. -->
  <polyline fill="none" stroke="#e8590c" stroke-width="2" stroke-linejoin="round" points="97.6,104.4 137.6,204.5 170.5,124.4 197.4,188.5 219.4,137.2 237.5,178.2 252.4,145.4 264.6,171.7 274.5,150.7 282.7,167.5 289.4,154 294.9,164.8 299.4,156.2 303.1,163.1 306.2,157.6 308.7,161.9"/>
  <g fill="#e8590c">
    <circle cx="97.6" cy="104.4" r="5"/>
    <circle cx="137.6" cy="204.5" r="2.75"/>
    <circle cx="170.5" cy="124.4" r="2.75"/>
    <circle cx="197.4" cy="188.5" r="2.75"/>
    <circle cx="219.4" cy="137.2" r="2.75"/>
    <circle cx="237.5" cy="178.2" r="2.75"/>
    <circle cx="252.4" cy="145.4" r="2.75"/>
    <circle cx="264.6" cy="171.7" r="2.75"/>
    <circle cx="274.5" cy="150.7" r="2.75"/>
    <circle cx="282.7" cy="167.5" r="2.75"/>
    <circle cx="289.4" cy="154" r="2.75"/>
    <circle cx="294.9" cy="164.8" r="2.75"/>
    <circle cx="299.4" cy="156.2" r="2.75"/>
    <circle cx="303.1" cy="163.1" r="2.75"/>
    <circle cx="306.2" cy="157.6" r="2.75"/>
    <circle cx="308.7" cy="161.9" r="2.75"/>
  </g>
  <circle cx="320" cy="160" r="5" fill="#12b886"/>
  <g fill="#868e96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    <text x="97.6" y="92">start</text>
    <text x="320" y="136">minimum</text>
  </g>
</svg>
