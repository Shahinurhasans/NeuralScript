<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tiny changes that cancel versus tiny changes that add up</title>
  <desc id="d">Two panels, each with a cat region and a dog region separated by a curved decision boundary. Left: four tiny changes point in different directions, so they cancel and the input stays on the cat side. Right: four tiny changes all point the same way, so they add up and carry the input across the boundary to the dog side. In both panels the changes stay inside a dashed square that marks the allowed change.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c92a2a"/>
    </marker>
    <!-- One panel's background: regions, boundary, training examples, allowed-change square -->
    <g id="panel">
      <path d="M0 40 H190 C160 110, 220 200, 180 290 H0 Z" fill="#4c7bd9" fill-opacity="0.12"/>
      <path d="M190 40 H300 V290 H180 C220 200, 160 110, 190 40 Z" fill="#e8590c" fill-opacity="0.12"/>
      <path d="M190 40 C160 110, 220 200, 180 290" fill="none" stroke="#868e96" stroke-width="2"/>
      <g fill="#4c7bd9"><circle cx="30" cy="110" r="4.5"/><circle cx="60" cy="270" r="4.5"/><circle cx="22" cy="200" r="4.5"/></g>
      <g fill="#e8590c"><circle cx="265" cy="100" r="4.5"/><circle cx="250" cy="235" r="4.5"/><circle cx="280" cy="170" r="4.5"/></g>
      <rect x="45" y="80" width="160" height="160" fill="none" stroke="#868e96" stroke-width="1.25" stroke-dasharray="5 4"/>
      <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#868e96" font-size="12">
        <text x="10" y="60">Model says “cat”</text>
        <text x="290" y="60" text-anchor="end">Model says “dog”</text>
        <text x="50" y="256">allowed change</text>
        <text x="196" y="283">decision boundary</text>
      </g>
    </g>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#868e96" text-anchor="middle">
    <text x="150" y="24">Changes push in different directions</text>
    <text x="490" y="24">Changes all push the same way</text>
  </g>

  <!-- Left: the changes cancel -->
  <use href="#panel"/>
  <circle cx="125" cy="160" r="7" fill="#4c7bd9" stroke="#ffffff" stroke-width="2"/>
  <g stroke="#c92a2a" stroke-width="2.25" fill="none" marker-end="url(#ah)">
    <line x1="129" y1="158" x2="160" y2="150"/>
    <line x1="162" y1="146" x2="150" y2="117"/>
    <line x1="146" y1="115" x2="114" y2="122"/>
    <line x1="111" y1="126" x2="120" y2="152"/>
  </g>
  <text x="125" y="192" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#868e96">original</text>

  <!-- Right: the changes add up -->
  <g transform="translate(340 0)">
    <use href="#panel"/>
    <g stroke="#c92a2a" stroke-width="2.25" fill="none" marker-end="url(#ah)">
      <line x1="125" y1="160" x2="143" y2="160"/>
      <line x1="144" y1="160" x2="162" y2="160"/>
      <line x1="163" y1="160" x2="181" y2="160"/>
      <line x1="182" y1="160" x2="196" y2="160"/>
    </g>
    <circle cx="125" cy="160" r="7" fill="#4c7bd9" stroke="#ffffff" stroke-width="2"/>
    <circle cx="203" cy="160" r="7" fill="#e8590c" stroke="#ffffff" stroke-width="2"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#868e96">
      <text x="125" y="192" text-anchor="middle">original</text>
      <text x="213" y="192">modified</text>
    </g>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#c92a2a" text-anchor="middle">
    <text x="150" y="314">They cancel: the model still says “cat”</text>
    <text x="490" y="314">They add up: the model now says “dog”</text>
  </g>
</svg>
