<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 275" width="680" height="275" role="img" aria-labelledby="t d">
  <title id="t">Six-stage engineering roadmap for training our Small Language Model</title>
  <desc id="d">Six stages arranged in two rows of three. Row 1: Stage 1 Dataset Curation (TinyStories), Stage 2 Tokenization and Memory-Mapped Files (BPE, train.bin, val.bin), Stage 3 Architecture Design (Decoder-only Transformer). Row 2: Stage 4 Pre-training Loop (Next-token cross-entropy loss), Stage 5 Validation and Story Generation, Stage 6 Ablation and Optimization. Stages 1 and 2 are highlighted as the focus of Part 1.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#868e96"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f9e44"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- Highlight box for Part 1 -->
    <rect x="8" y="14" width="444" height="122" rx="10" fill="#2f9e44" fill-opacity="0.06" stroke="#2f9e44" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="230" y="30" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f9e44">COVERED IN PART 1 (DATA &amp; TOKENIZATION FOUNDATION)</text>

    <!-- Stage 1 -->
    <rect x="18" y="40" width="194" height="86" rx="8" fill="#2f9e44" fill-opacity="0.14" stroke="#2f9e44" stroke-width="1.6"/>
    <text x="115" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#2f9e44">1. Prepare Dataset</text>
    <g font-size="11" fill="#868e96" text-anchor="middle">
      <text x="115" y="82">Curate TinyStories corpus</text>
      <text x="115" y="98">Clean duplicates &amp; split</text>
      <text x="115" y="114">train / validation sets</text>
    </g>

    <line x1="214" y1="83" x2="242" y2="83" stroke="#2f9e44" stroke-width="2" marker-end="url(#ahg)"/>

    <!-- Stage 2 -->
    <rect x="246" y="40" width="196" height="86" rx="8" fill="#2f9e44" fill-opacity="0.14" stroke="#2f9e44" stroke-width="1.6"/>
    <text x="344" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#2f9e44">2. Pre-process &amp; Tokenize</text>
    <g font-size="11" fill="#868e96" text-anchor="middle">
      <text x="344" y="82">Subword BPE encoding</text>
      <text x="344" y="98">Pack uint16 IDs into</text>
      <text x="344" y="114">mmap train.bin &amp; val.bin</text>
    </g>

    <line x1="444" y1="83" x2="472" y2="83" stroke="#868e96" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- Stage 3 -->
    <rect x="476" y="40" width="194" height="86" rx="8" fill="#4c7bd9" fill-opacity="0.12" stroke="#4c7bd9" stroke-width="1.5"/>
    <text x="573" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#4c7bd9">3. Design Architecture</text>
    <g font-size="11" fill="#868e96" text-anchor="middle">
      <text x="573" y="82">Decoder-only Transformer</text>
      <text x="573" y="98">Context window, layers,</text>
      <text x="573" y="114">heads &amp; embedding dim</text>
    </g>

    <!-- Connector from Stage 3 down to Stage 4 -->
    <path d="M573 128 V146 H115 V162" fill="none" stroke="#868e96" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- Stage 4 -->
    <rect x="18" y="166" width="194" height="86" rx="8" fill="#7048e8" fill-opacity="0.12" stroke="#7048e8" stroke-width="1.5"/>
    <text x="115" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#7048e8">4. Train the Model</text>
    <g font-size="11" fill="#868e96" text-anchor="middle">
      <text x="115" y="208">Stream batches from disk</text>
      <text x="115" y="224">Minimize next-token loss</text>
      <text x="115" y="240">with AdamW &amp; LR schedule</text>
    </g>

    <line x1="214" y1="209" x2="242" y2="209" stroke="#868e96" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- Stage 5 -->
    <rect x="246" y="166" width="196" height="86" rx="8" fill="#e8590c" fill-opacity="0.12" stroke="#e8590c" stroke-width="1.5"/>
    <text x="344" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#e8590c">5. Validate &amp; Generate</text>
    <g font-size="11" fill="#868e96" text-anchor="middle">
      <text x="344" y="208">Track train vs. val loss</text>
      <text x="344" y="224">Generate unseen stories</text>
      <text x="344" y="240">with temperature / top-k</text>
    </g>

    <line x1="444" y1="209" x2="472" y2="209" stroke="#868e96" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- Stage 6 -->
    <rect x="476" y="166" width="194" height="86" rx="8" fill="#c92a2a" fill-opacity="0.10" stroke="#c92a2a" stroke-width="1.5"/>
    <text x="573" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#c92a2a">6. Evaluate &amp; Improve</text>
    <g font-size="11" fill="#868e96" text-anchor="middle">
      <text x="573" y="208">Ablate vocabulary size,</text>
      <text x="573" y="224">depth, learning rate &amp;</text>
      <text x="573" y="240">sampling hyperparameters</text>
    </g>
  </g>
</svg>
