<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" aria-labelledby="t d">
  <title id="t">How a Small Language Model predicts the next token</title>
  <desc id="d">Four stages from left to right. Stage 1: Input prompt "The little boy opened the". Stage 2: Tokenizer splits text into subwords and integer IDs [42, 615, 1204, 891, 42]. Stage 3: Small Transformer with 15 to 30 million parameters processes the sequence through embedding, self-attention, and feed-forward layers. Stage 4: Next-token probability distribution ranks "door" at 64%, "box" at 21%, "book" at 9%, and "window" at 4%.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#868e96"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="340" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#868e96">Autoregressive next-token prediction in a compact Transformer</text>

    <!-- 1. Input prompt -->
    <rect x="10" y="42" width="136" height="156" rx="8" fill="#4c7bd9" fill-opacity="0.12" stroke="#4c7bd9" stroke-width="1.5"/>
    <text x="78" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#4c7bd9">1. Input Context</text>
    <g font-size="11.5" fill="#868e96" text-anchor="middle">
      <text x="78" y="94">Raw text prompt:</text>
      <text x="78" y="120" font-weight="600" fill="#4c7bd9">“The little boy</text>
      <text x="78" y="138" font-weight="600" fill="#4c7bd9">opened the ___”</text>
      <text x="78" y="170" font-size="10.5">What word should</text>
      <text x="78" y="184" font-size="10.5">come next?</text>
    </g>

    <line x1="148" y1="120" x2="168" y2="120" stroke="#868e96" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- 2. Tokenizer -->
    <rect x="172" y="42" width="144" height="156" rx="8" fill="#2f9e44" fill-opacity="0.12" stroke="#2f9e44" stroke-width="1.5"/>
    <text x="244" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#2f9e44">2. Tokenizer (BPE)</text>
    <g font-size="11" fill="#868e96" text-anchor="middle">
      <text x="244" y="90">Subword pieces:</text>
      <text x="244" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#2f9e44">[The, little, boy,</text>
      <text x="244" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#2f9e44">opened, the]</text>
      <text x="244" y="148">Token IDs:</text>
      <text x="244" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#2f9e44">[42, 615, 1204,</text>
      <text x="244" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#2f9e44">891, 42]</text>
    </g>

    <line x1="318" y1="120" x2="338" y2="120" stroke="#868e96" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- 3. Small Transformer -->
    <rect x="342" y="42" width="148" height="156" rx="8" fill="#7048e8" fill-opacity="0.12" stroke="#7048e8" stroke-width="1.5"/>
    <text x="416" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#7048e8">3. Small Transformer</text>
    <g font-size="11" fill="#868e96" text-anchor="middle">
      <text x="416" y="88" font-weight="600" fill="#7048e8">15M–30M parameters</text>
      <rect x="358" y="98" width="116" height="22" rx="4" fill="#7048e8" fill-opacity="0.12" stroke="#7048e8" stroke-width="1"/>
      <text x="416" y="113" font-size="10.5">Token + Pos Embeddings</text>
      <rect x="358" y="126" width="116" height="22" rx="4" fill="#7048e8" fill-opacity="0.12" stroke="#7048e8" stroke-width="1"/>
      <text x="416" y="141" font-size="10.5">Masked Self-Attention</text>
      <rect x="358" y="154" width="116" height="22" rx="4" fill="#7048e8" fill-opacity="0.12" stroke="#7048e8" stroke-width="1"/>
      <text x="416" y="169" font-size="10.5">Feed-Forward Network</text>
      <text x="416" y="191" font-size="10" font-style="italic">× N decoder blocks</text>
    </g>

    <line x1="492" y1="120" x2="512" y2="120" stroke="#868e96" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- 4. Next-Token Probabilities -->
    <rect x="516" y="42" width="154" height="156" rx="8" fill="#e8590c" fill-opacity="0.12" stroke="#e8590c" stroke-width="1.5"/>
    <text x="593" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#e8590c">4. Next-Token Probs</text>
    <g font-size="11" fill="#868e96">
      <text x="526" y="94" font-weight="600" fill="#e8590c">“door”</text>
      <rect x="572" y="84" width="62" height="12" rx="3" fill="#e8590c"/>
      <text x="638" y="94" font-size="10.5" font-weight="600" fill="#e8590c">64%</text>

      <text x="526" y="118">“box”</text>
      <rect x="572" y="108" width="24" height="12" rx="3" fill="#e8590c" fill-opacity="0.65"/>
      <text x="600" y="118" font-size="10.5">21%</text>

      <text x="526" y="142">“book”</text>
      <rect x="572" y="132" width="12" height="12" rx="3" fill="#868e96" fill-opacity="0.6"/>
      <text x="588" y="142" font-size="10.5">9%</text>

      <text x="526" y="166">“window”</text>
      <rect x="572" y="156" width="6" height="12" rx="3" fill="#868e96" fill-opacity="0.45"/>
      <text x="582" y="166" font-size="10.5">4%</text>

      <text x="593" y="188" text-anchor="middle" font-size="10.5" font-style="italic">Sampled token → append</text>
    </g>

    <text x="340" y="226" text-anchor="middle" font-size="11.5" fill="#868e96">During training, the model adjusts its weights so the true next token receives higher probability</text>
  </g>
</svg>
