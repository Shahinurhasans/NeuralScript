<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img" aria-labelledby="t d">
  <title id="t">Tokenization and memory-mapped binary data pipeline</title>
  <desc id="d">Top row shows four preprocessing steps: 1, Raw story text with an end-of-text marker; 2, BPE subword tokens; 3, 16-bit integer token IDs; 4, Contiguous binary files train.bin and val.bin on disk. Bottom panel shows how OS memory mapping (mmap) slices a batch window of length T for input x and shifted target y without loading the entire file into RAM.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#868e96"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="340" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#868e96">From human-readable stories to zero-copy memory-mapped training batches</text>

    <!-- Step 1: Raw story -->
    <rect x="10" y="34" width="146" height="106" rx="8" fill="#4c7bd9" fill-opacity="0.12" stroke="#4c7bd9" stroke-width="1.5"/>
    <text x="83" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c7bd9">1. Raw Story</text>
    <g font-size="11" fill="#868e96" text-anchor="middle">
      <text x="83" y="78" fill="#4c7bd9" font-weight="600">“The cat sat on</text>
      <text x="83" y="94" fill="#4c7bd9" font-weight="600">the mat.”</text>
      <text x="83" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">+ &lt;|endoftext|&gt;</text>
      <text x="83" y="130" font-size="10">story separator</text>
    </g>

    <line x1="158" y1="87" x2="176" y2="87" stroke="#868e96" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- Step 2: BPE Subwords -->
    <rect x="180" y="34" width="148" height="106" rx="8" fill="#2f9e44" fill-opacity="0.12" stroke="#2f9e44" stroke-width="1.5"/>
    <text x="254" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e44">2. BPE Tokens</text>
    <g font-size="10.5" fill="#868e96" text-anchor="middle">
      <text x="254" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2f9e44">["The", " cat",</text>
      <text x="254" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2f9e44">" sat", " on",</text>
      <text x="254" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2f9e44">" the", " mat", "."]</text>
      <text x="254" y="130" font-size="10">frequent byte pairs</text>
    </g>

    <line x1="330" y1="87" x2="348" y2="87" stroke="#868e96" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- Step 3: Integer IDs -->
    <rect x="352" y="34" width="148" height="106" rx="8" fill="#7048e8" fill-opacity="0.12" stroke="#7048e8" stroke-width="1.5"/>
    <text x="426" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7048e8">3. Token IDs (uint16)</text>
    <g font-size="10.5" fill="#868e96" text-anchor="middle">
      <text x="426" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#7048e8">[464, 3797, 3332,</text>
      <text x="426" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#7048e8">319, 262, 2603, 13]</text>
      <text x="426" y="116" font-size="10">2 bytes per token</text>
      <text x="426" y="130" font-size="10">(vocab ≤ 65,535)</text>
    </g>

    <line x1="502" y1="87" x2="520" y2="87" stroke="#868e96" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- Step 4: Binary files -->
    <rect x="524" y="34" width="146" height="106" rx="8" fill="#e8590c" fill-opacity="0.12" stroke="#e8590c" stroke-width="1.5"/>
    <text x="597" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8590c">4. Disk Binary Files</text>
    <g font-size="11" fill="#868e96" text-anchor="middle">
      <text x="597" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#e8590c">train.bin</text>
      <text x="597" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#e8590c">val.bin</text>
      <text x="597" y="116" font-size="10">flat contiguous array</text>
      <text x="597" y="130" font-size="10">streamed via OS mmap</text>
    </g>

    <!-- Arrow down to mmap batch slicing panel -->
    <path d="M597 142 V162 H340 V174" fill="none" stroke="#868e96" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- Bottom panel: Memory-mapped sliding window -->
    <rect x="10" y="178" width="660" height="122" rx="8" fill="#868e96" fill-opacity="0.07" stroke="#868e96" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="340" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#868e96">How OS Memory Mapping (np.memmap) constructs a training pair (x, y) on the fly</text>

    <!-- Input sequence x -->
    <text x="115" y="228" text-anchor="end" font-size="11.5" font-weight="700" fill="#4c7bd9">Input x :</text>
    <g transform="translate(125 212)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <rect x="0" y="0" width="78" height="24" rx="4" fill="#4c7bd9" fill-opacity="0.15" stroke="#4c7bd9" stroke-width="1.2"/>
      <text x="39" y="16" fill="#4c7bd9">464 (The)</text>

      <rect x="86" y="0" width="78" height="24" rx="4" fill="#4c7bd9" fill-opacity="0.15" stroke="#4c7bd9" stroke-width="1.2"/>
      <text x="125" y="16" fill="#4c7bd9">3797 (cat)</text>

      <rect x="172" y="0" width="78" height="24" rx="4" fill="#4c7bd9" fill-opacity="0.15" stroke="#4c7bd9" stroke-width="1.2"/>
      <text x="211" y="16" fill="#4c7bd9">3332 (sat)</text>

      <rect x="258" y="0" width="78" height="24" rx="4" fill="#4c7bd9" fill-opacity="0.15" stroke="#4c7bd9" stroke-width="1.2"/>
      <text x="297" y="16" fill="#4c7bd9">319 (on)</text>

      <rect x="344" y="0" width="78" height="24" rx="4" fill="#4c7bd9" fill-opacity="0.15" stroke="#4c7bd9" stroke-width="1.2"/>
      <text x="383" y="16" fill="#4c7bd9">262 (the)</text>
    </g>

    <!-- Target sequence y (shifted by +1) -->
    <text x="115" y="264" text-anchor="end" font-size="11.5" font-weight="700" fill="#2f9e44">Target y :</text>
    <g transform="translate(125 248)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <rect x="0" y="0" width="78" height="24" rx="4" fill="#2f9e44" fill-opacity="0.15" stroke="#2f9e44" stroke-width="1.2"/>
      <text x="39" y="16" fill="#2f9e44">3797 (cat)</text>

      <rect x="86" y="0" width="78" height="24" rx="4" fill="#2f9e44" fill-opacity="0.15" stroke="#2f9e44" stroke-width="1.2"/>
      <text x="125" y="16" fill="#2f9e44">3332 (sat)</text>

      <rect x="172" y="0" width="78" height="24" rx="4" fill="#2f9e44" fill-opacity="0.15" stroke="#2f9e44" stroke-width="1.2"/>
      <text x="211" y="16" fill="#2f9e44">319 (on)</text>

      <rect x="258" y="0" width="78" height="24" rx="4" fill="#2f9e44" fill-opacity="0.15" stroke="#2f9e44" stroke-width="1.2"/>
      <text x="297" y="16" fill="#2f9e44">262 (the)</text>

      <rect x="344" y="0" width="78" height="24" rx="4" fill="#2f9e44" fill-opacity="0.15" stroke="#2f9e44" stroke-width="1.2"/>
      <text x="383" y="16" fill="#2f9e44">2603 (mat)</text>
    </g>

    <text x="610" y="236" text-anchor="middle" font-size="10.5" fill="#868e96">Shifted by</text>
    <text x="610" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#2f9e44">+1 position</text>
    <text x="610" y="264" text-anchor="middle" font-size="10.5" fill="#868e96">on disk slice</text>

    <text x="340" y="290" text-anchor="middle" font-size="11" fill="#868e96">Only the requested batch bytes are paged from disk into RAM—millions of stories never overflow memory</text>
  </g>
</svg>
