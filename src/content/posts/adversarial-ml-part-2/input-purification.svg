<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" role="img" aria-labelledby="t d">
  <title id="t">Input purification: clean the input before the model sees it</title>
  <desc id="d">A pipeline. An adversarial image of the digit 7, which contains faint hidden noise, goes into a cleaner such as JPEG compression, bit-depth reduction, a denoiser or a diffusion model. The cleaner outputs a cleaned 7 without the noise, which goes into the unchanged model, which answers 7. Below, a red note explains the weakness: an attacker who knows about the cleaner can attack the cleaner and the model together.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#868e96"/>
    </marker>
    <pattern id="noise" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="2" height="2" fill="#c92a2a" fill-opacity="0.55"/>
      <rect x="5" y="4" width="2" height="2" fill="#4c7bd9" fill-opacity="0.55"/>
      <rect x="2" y="6" width="1.5" height="1.5" fill="#868e96" fill-opacity="0.6"/>
    </pattern>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- adversarial input -->
    <rect x="20" y="40" width="100" height="100" rx="4" fill="#212529"/>
    <rect x="20" y="40" width="100" height="100" rx="4" fill="url(#noise)"/>
    <text x="70" y="120" text-anchor="middle" font-size="78" font-weight="700" fill="#f1f3f5">7</text>
    <text x="70" y="160" text-anchor="middle" font-size="12" fill="#868e96">Adversarial input</text>
    <text x="70" y="176" text-anchor="middle" font-size="11" fill="#c92a2a">(hidden noise)</text>

    <line x1="126" y1="90" x2="166" y2="90" stroke="#868e96" stroke-width="2" marker-end="url(#ah)"/>

    <!-- cleaner -->
    <rect x="172" y="30" width="160" height="120" rx="8" fill="#2f9e44" fill-opacity="0.12" stroke="#2f9e44" stroke-width="1.5"/>
    <text x="252" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#2f9e44">Cleaner</text>
    <g font-size="11.5" fill="#868e96" text-anchor="middle">
      <text x="252" y="76">JPEG compression</text>
      <text x="252" y="94">bit-depth reduction</text>
      <text x="252" y="112">denoiser network</text>
      <text x="252" y="130">GAN / diffusion model</text>
    </g>

    <line x1="338" y1="90" x2="378" y2="90" stroke="#868e96" stroke-width="2" marker-end="url(#ah)"/>

    <!-- cleaned image -->
    <rect x="384" y="40" width="100" height="100" rx="4" fill="#212529"/>
    <text x="434" y="120" text-anchor="middle" font-size="78" font-weight="700" fill="#f1f3f5">7</text>
    <text x="434" y="160" text-anchor="middle" font-size="12" fill="#868e96">Cleaned input</text>

    <line x1="490" y1="90" x2="530" y2="90" stroke="#868e96" stroke-width="2" marker-end="url(#ah)"/>

    <!-- model -->
    <rect x="536" y="50" width="124" height="80" rx="8" fill="#4c7bd9" fill-opacity="0.12" stroke="#4c7bd9" stroke-width="1.5"/>
    <text x="598" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#4c7bd9">Same model</text>
    <text x="598" y="98" text-anchor="middle" font-size="11.5" fill="#868e96">(not retrained)</text>
    <text x="598" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#2f9e44">says “7”</text>

    <!-- weakness -->
    <rect x="20" y="198" width="640" height="52" rx="8" fill="#c92a2a" fill-opacity="0.08" stroke="#c92a2a" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="340" y="220" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c92a2a">Weakness: if the attacker knows the cleaner is there, they attack “cleaner + model”</text>
    <text x="340" y="238" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c92a2a">as one big model, and the noise is designed to survive the cleaning (adaptive attack).</text>
  </g>
</svg>
