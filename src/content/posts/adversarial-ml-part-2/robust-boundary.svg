<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Decision boundary after normal training and after adversarial training</title>
  <desc id="d">Two panels with cat examples in blue and dog examples in orange. Around every example is a dashed square showing the allowed change epsilon. Left, normal training: the boundary bends close to one cat and one dog, so their squares cross the boundary, marked in red; a small push can flip them. Right, adversarial training: the boundary sits in the middle of the gap, so every square lies fully on its own side; every example has a safety margin.</desc>
  <defs>
    <g id="pts">
      <g fill="#4c7bd9" stroke="#ffffff" stroke-width="1.5">
        <circle cx="50" cy="100" r="6"/><circle cx="140" cy="110" r="6"/><circle cx="70" cy="210" r="6"/><circle cx="110" cy="262" r="6"/>
      </g>
      <g fill="#e8590c" stroke="#ffffff" stroke-width="1.5">
        <circle cx="255" cy="88" r="6"/><circle cx="250" cy="150" r="6"/><circle cx="205" cy="200" r="6"/><circle cx="255" cy="255" r="6"/>
      </g>
    </g>
    <g id="labels" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#868e96" font-size="12">
      <text x="8" y="58">Model says “cat”</text>
      <text x="292" y="58" text-anchor="end">Model says “dog”</text>
    </g>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#868e96" text-anchor="middle">
    <text x="150" y="24">Normal training</text>
    <text x="490" y="24">Adversarial training</text>
  </g>

  <!-- LEFT PANEL -->
  <g>
    <path d="M0 40 L175 40 C170 70, 140 90, 150 115 C160 140, 205 160, 196 200 C190 235, 175 260, 178 290 L0 290 Z" fill="#4c7bd9" fill-opacity="0.12"/>
    <path d="M300 40 L175 40 C170 70, 140 90, 150 115 C160 140, 205 160, 196 200 C190 235, 175 260, 178 290 L300 290 Z" fill="#e8590c" fill-opacity="0.12"/>
    <path d="M175 40 C170 70, 140 90, 150 115 C160 140, 205 160, 196 200 C190 235, 175 260, 178 290" fill="none" stroke="#868e96" stroke-width="2"/>
    <g fill="none" stroke="#868e96" stroke-width="1.1" stroke-dasharray="4 3">
      <rect x="32" y="82" width="36" height="36"/><rect x="52" y="192" width="36" height="36"/><rect x="92" y="244" width="36" height="36"/>
      <rect x="237" y="70" width="36" height="36"/><rect x="232" y="132" width="36" height="36"/><rect x="237" y="237" width="36" height="36"/>
    </g>
    <g fill="#c92a2a" fill-opacity="0.12" stroke="#c92a2a" stroke-width="1.6" stroke-dasharray="4 3">
      <rect x="122" y="92" width="36" height="36"/><rect x="187" y="182" width="36" height="36"/>
    </g>
    <use href="#pts"/>
    <use href="#labels"/>
    <text x="96" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle">too close!</text>
    <text x="255" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle">too close!</text>
  </g>

  <!-- RIGHT PANEL -->
  <g transform="translate(340 0)">
    <path d="M0 40 L172 40 C168 120, 176 200, 172 290 L0 290 Z" fill="#4c7bd9" fill-opacity="0.12"/>
    <path d="M300 40 L172 40 C168 120, 176 200, 172 290 L300 290 Z" fill="#e8590c" fill-opacity="0.12"/>
    <path d="M172 40 C168 120, 176 200, 172 290" fill="none" stroke="#868e96" stroke-width="2"/>
    <g fill="none" stroke="#2f9e44" stroke-width="1.3" stroke-dasharray="4 3">
      <rect x="32" y="82" width="36" height="36"/><rect x="122" y="92" width="36" height="36"/><rect x="52" y="192" width="36" height="36"/><rect x="92" y="244" width="36" height="36"/>
      <rect x="237" y="70" width="36" height="36"/><rect x="232" y="132" width="36" height="36"/><rect x="187" y="182" width="36" height="36"/><rect x="237" y="237" width="36" height="36"/>
    </g>
    <use href="#pts"/>
    <use href="#labels"/>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    <text x="150" y="312" fill="#c92a2a">The line passes through two dashed squares:</text>
    <text x="150" y="328" fill="#c92a2a">a small, allowed push flips those answers</text>
    <text x="490" y="312" fill="#2f9e44">Every dashed square stays on its own side:</text>
    <text x="490" y="328" fill="#2f9e44">no allowed push can flip any answer</text>
  </g>
</svg>
