<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Gradient masking: hiding the slope does not remove the cliff</title>
  <desc id="d">A plot of how wrong the model is (loss) as the input is changed. Around the original input the curve is completely flat, so the gradient is zero and a gradient-based attack has no direction to follow and gives up. But a little further away, still inside the allowed change epsilon, the curve rises sharply above the line where the model becomes wrong. An adaptive attack finds this region.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#868e96"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c92a2a"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- allowed change region -->
    <rect x="150" y="40" width="340" height="200" fill="#868e96" fill-opacity="0.08"/>
    <line x1="150" y1="40" x2="150" y2="240" stroke="#868e96" stroke-width="1.2" stroke-dasharray="5 4"/>
    <line x1="490" y1="40" x2="490" y2="240" stroke="#868e96" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="320" y="56" text-anchor="middle" font-size="12" fill="#868e96">allowed change (−ε to +ε)</text>

    <!-- wrong-answer threshold -->
    <rect x="60" y="40" width="560" height="60" fill="#c92a2a" fill-opacity="0.07"/>
    <line x1="60" y1="100" x2="620" y2="100" stroke="#c92a2a" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="68" y="92" font-size="11.5" fill="#c92a2a">above this line the model is wrong</text>

    <!-- axes -->
    <line x1="60" y1="240" x2="625" y2="240" stroke="#868e96" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="60" y1="240" x2="60" y2="30" stroke="#868e96" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="340" y="262" text-anchor="middle" font-size="12" fill="#868e96">change made to the input</text>
    <text x="40" y="140" text-anchor="middle" font-size="12" fill="#868e96" transform="rotate(-90 40 140)">how wrong the model is</text>

    <!-- loss curve: flat plateau, then cliff -->
    <path d="M70 215 C110 214, 130 212, 160 212 L240 212 L300 212 L330 212 C365 212, 380 205, 395 160 C405 125, 412 85, 430 70 C445 60, 470 62, 500 68 C540 76, 580 80, 615 82" fill="none" stroke="#4c7bd9" stroke-width="2.6"/>

    <!-- original point -->
    <circle cx="240" cy="212" r="6.5" fill="#4c7bd9" stroke="#ffffff" stroke-width="2"/>
    <text x="240" y="232" text-anchor="middle" font-size="11.5" fill="#868e96">original input</text>

    <!-- gradient zero note -->
    <text x="240" y="150" text-anchor="middle" font-size="12" fill="#4c7bd9">Flat here: gradient ≈ 0</text>
    <text x="240" y="166" text-anchor="middle" font-size="12" fill="#4c7bd9">The attack has no direction</text>
    <text x="240" y="182" text-anchor="middle" font-size="12" fill="#4c7bd9">and gives up → “robust!”</text>

    <!-- cliff note -->
    <circle cx="430" cy="70" r="6.5" fill="#c92a2a" stroke="#ffffff" stroke-width="2"/>
    <path d="M300 205 C350 200, 380 160, 420 82" fill="none" stroke="#c92a2a" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ahr)"/>
    <text x="498" y="160" font-size="12" fill="#c92a2a">But a wrong answer</text>
    <text x="498" y="176" font-size="12" fill="#c92a2a">is still within ±ε.</text>
    <text x="498" y="192" font-size="12" fill="#c92a2a">Adaptive attacks</text>
    <text x="498" y="208" font-size="12" fill="#c92a2a">find it.</text>
  </g>
</svg>
