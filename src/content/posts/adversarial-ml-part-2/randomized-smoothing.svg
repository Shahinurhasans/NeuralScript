<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d">
  <title id="t">Randomized smoothing: many noisy copies, one vote, one guarantee</title>
  <desc id="d">Left: one input image is copied many times and random noise is added to each copy. Each noisy copy is classified by the model, and the answers are counted: cat 920, dog 60, fox 20. The majority answer, cat, is the final prediction. Right: a picture of the input point inside the cat region with a circle of radius R around it that lies fully inside the cat region; the method proves that no change smaller than R can change the answer.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#868e96"/>
    </marker>
    <pattern id="gn" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="3" y="3" width="2" height="2" fill="#000000" fill-opacity="0.35"/>
      <rect x="4" y="0" width="1.5" height="1.5" fill="#ffffff" fill-opacity="0.25"/>
    </pattern>
    <g id="img">
      <rect width="34" height="34" rx="3" fill="#4c7bd9" fill-opacity="0.55"/>
      <circle cx="17" cy="19" r="9" fill="#ffffff" fill-opacity="0.75"/>
      <path d="M9 13 L11 4 L16 11 Z M25 13 L23 4 L18 11 Z" fill="#ffffff" fill-opacity="0.75"/>
    </g>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="215" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#868e96">How it predicts</text>
    <text x="560" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#868e96">What it guarantees</text>

    <!-- original -->
    <use href="#img" x="14" y="118"/>
    <text x="31" y="170" text-anchor="middle" font-size="11" fill="#868e96">input</text>
    <line x1="54" y1="135" x2="84" y2="135" stroke="#868e96" stroke-width="2" marker-end="url(#ah)"/>
    <text x="69" y="124" text-anchor="middle" font-size="10" fill="#868e96">+ noise</text>

    <!-- noisy copies -->
    <g>
      <use href="#img" x="92" y="40"/><rect x="92" y="40" width="34" height="34" rx="3" fill="url(#gn)"/>
      <use href="#img" x="92" y="80"/><rect x="92" y="80" width="34" height="34" rx="3" fill="url(#gn)" transform="translate(0 0)"/>
      <use href="#img" x="92" y="120"/><rect x="92" y="120" width="34" height="34" rx="3" fill="url(#gn)"/>
      <use href="#img" x="92" y="160"/><rect x="92" y="160" width="34" height="34" rx="3" fill="url(#gn)"/>
      <text x="109" y="214" text-anchor="middle" font-size="14" fill="#868e96">⋮</text>
    </g>
    <text x="109" y="246" text-anchor="middle" font-size="11" fill="#868e96">1,000 noisy</text>
    <text x="109" y="260" text-anchor="middle" font-size="11" fill="#868e96">copies</text>

    <line x1="132" y1="135" x2="154" y2="135" stroke="#868e96" stroke-width="2" marker-end="url(#ah)"/>

    <!-- model -->
    <rect x="160" y="105" width="104" height="60" rx="8" fill="#4c7bd9" fill-opacity="0.12" stroke="#4c7bd9" stroke-width="1.5"/>
    <text x="212" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c7bd9">Model</text>
    <text x="212" y="150" text-anchor="middle" font-size="10.5" fill="#868e96">(trained on noise)</text>

    <line x1="268" y1="135" x2="286" y2="135" stroke="#868e96" stroke-width="2" marker-end="url(#ah)"/>

    <!-- votes -->
    <text x="292" y="72" font-size="12" font-weight="600" fill="#868e96">Votes</text>
    <g font-size="11.5" fill="#868e96">
      <text x="292" y="98">cat</text>
      <rect x="320" y="88" width="92" height="13" fill="#4c7bd9"/>
      <text x="416" y="98">920</text>
      <text x="292" y="122">dog</text>
      <rect x="320" y="112" width="6" height="13" fill="#e8590c"/>
      <text x="330" y="122">60</text>
      <text x="292" y="146">fox</text>
      <rect x="320" y="136" width="2" height="13" fill="#868e96"/>
      <text x="326" y="146">20</text>
    </g>
    <text x="292" y="180" font-size="12.5" font-weight="700" fill="#2f9e44">Final answer: “cat”</text>
    <text x="292" y="200" font-size="11" fill="#868e96">(the majority vote)</text>

    <!-- divider -->
    <line x1="455" y1="40" x2="455" y2="270" stroke="#868e96" stroke-opacity="0.4" stroke-width="1"/>

    <!-- guarantee panel -->
    <g transform="translate(470 40)">
      <path d="M0 0 H150 C130 70, 180 140, 150 230 H0 Z" fill="#4c7bd9" fill-opacity="0.12"/>
      <path d="M150 0 H190 V230 H150 C180 140, 130 70, 150 0 Z" fill="#e8590c" fill-opacity="0.12"/>
      <path d="M150 0 C130 70, 180 140, 150 230" fill="none" stroke="#868e96" stroke-width="2"/>
      <circle cx="80" cy="115" r="58" fill="#2f9e44" fill-opacity="0.08" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="5 4"/>
      <line x1="80" y1="115" x2="138" y2="115" stroke="#2f9e44" stroke-width="1.6"/>
      <text x="109" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#2f9e44">R</text>
      <circle cx="80" cy="115" r="6" fill="#4c7bd9" stroke="#ffffff" stroke-width="1.5"/>
      <text x="8" y="18" font-size="11.5" fill="#868e96">“cat”</text>
      <text x="184" y="18" font-size="11.5" fill="#868e96" text-anchor="end">“dog”</text>
    </g>
    <text x="560" y="286" text-anchor="middle" font-size="11.5" fill="#2f9e44">Proven: no change smaller than R can flip it</text>
  </g>
</svg>
